<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.workers.dev; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>熱門新聞庫</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="lib.js" defer></script>
<script src="api.js" defer></script>
<script src="qpt.js" defer></script>
<script src="paging.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <h1>熱門新聞庫</h1>
  <div class="search"><input type="search" id="q" placeholder="搜尋標題、小編文、編號" aria-label="搜尋"></div>
  <div class="tools">
    <button class="btn iconbtn searchbtn" id="searchBtn" type="button" aria-label="搜尋" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="btn" id="settingsBtn" type="button" aria-label="設定"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span class="lbl">設定</span></button>
    <button class="btn primary" id="addBtn" type="button" aria-label="新增新聞"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">＋ 新增新聞</span></button>
  </div>
</header>
<div class="wrap">
  <div class="split">
      <section class="pane-l">
        <div class="filters">
          <div class="chips" id="chips"></div>
          <div class="sortrow">
            <span id="cnt"></span>
            <div class="ctl">
              <div class="xsel" id="sortX">
                <button type="button" class="xsel-btn" aria-haspopup="true" aria-expanded="false"><span class="xsel-lbl">排序</span><span class="xsel-val"></span><span class="xsel-caret" aria-hidden="true">▾</span></button>
                <div class="xsel-opts" role="radiogroup" aria-label="排序" hidden></div>
              </div>
              <div class="xsel" id="sizeX">
                <button type="button" class="xsel-btn" aria-haspopup="true" aria-expanded="false"><span class="xsel-lbl">顯示</span><span class="xsel-val"></span><span class="xsel-caret" aria-hidden="true">▾</span></button>
                <div class="xsel-opts" role="radiogroup" aria-label="顯示則數" hidden></div>
              </div>
            </div>
          </div>
        </div>
        <div class="rows" id="list" role="listbox" aria-label="新聞列表"></div>
        <nav class="pager" id="pager" aria-label="分頁" hidden></nav>
      <p class="foot">改標可左右滑動（手機用手指；電腦可用滑鼠拖曳、觸控板橫滑、方向鍵，或把滑鼠移到卡片上按 ‹ ›）。「複製標題」複製目前顯示的那一版；先按「複製標題」再按「複製留言」，會自動記為已使用（記在複製的那一版和整則新聞上）；也可以按「標記已使用」手動記錄。複製留言的網址格式：https://news.tvbs.com.tw/news/編號</p>
      </section>
      <section class="pane-r"><div id="card"></div></section>
  </div>
</div>

<dialog id="settingsDlg">
  <form id="settingsForm" method="dialog">
    <h2>設定</h2>
    <label>Worker 網址
      <input id="sUrl" type="text" placeholder="https://名稱.帳號.workers.dev" autocomplete="off" spellcheck="false">
    </label>
    <label>密碼
      <input id="sToken" type="password" autocomplete="off" spellcheck="false">
    </label>
    <label class="check"><input id="sRemember" type="checkbox"> <span>在這台裝置記住登入（最多 12 小時，不存密碼）<br><small>勾選後登入憑證會存在這個瀏覽器，同一個 github.io 網域下的其他網頁也讀得到。公用或共用的電腦請不要勾。</small></span></label>
    <div class="hint warn" id="sMsg" role="alert" hidden></div>
    <ul class="steps" id="sSteps" hidden></ul>
    <div class="dlgrow">
      <button class="btn danger" type="button" id="sClear">清除這台裝置的設定</button>
      <button class="btn primary" type="submit" id="sSave">登入</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增新聞</h2>
    <label>原文網址
      <input id="fUrl" type="text" inputmode="url" placeholder="https://news.tvbs.com.tw/cars/4032757" autocomplete="off" maxlength="2000">
    </label>
    <div class="hint" id="idHint"></div>
    <label>分類
      <select id="fCat"></select>
    </label>
    <label>原始標題（建立後不可修改）
      <input id="fOrig" type="text" autocomplete="off" maxlength="500">
    </label>
    <div class="hint" id="titleHint"></div>
    <div id="vars"></div>
    <button class="btn" type="button" id="addVar">＋ 新增一個改標</button>
    <label>小編文（整則新聞共用）
      <textarea id="fNote" maxlength="5000"></textarea>
    </label>
    <div class="hint warn" id="err" role="alert" hidden></div>
    <div class="dlgrow">
      <button class="btn danger" type="button" id="del" hidden>刪除這則</button>
      <button class="btn" type="button" id="cancel">取消</button>
      <button class="btn primary" type="submit" id="save">儲存</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
