<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熱門新聞庫｜介面改版預覽</title>
<style>
:root{
  --bg:#f3f5f4; --surface:#fff; --fg:#1d2420; --muted:#66706a; --line:#dde1dd;
  --accent:#0d6b5c; --accent-fg:#fff; --accent-soft:#e1f0ec; --ok:#1c7a45; --warn:#b26a00; --warn-bg:#fdf1d8;
  --line-green:#06c755; --chat-bg:#8fa6c9;
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1b211e;--fg:#e8ece9;--muted:#9aa59e;--line:#2c342f;
  --accent:#4fc2ac;--accent-fg:#06211b;--accent-soft:#1a2f2a;--warn:#f0d28a;--warn-bg:#3a2f12;--ok:#6fd49a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
.banner{max-width:1100px;margin:0 auto 14px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 14px;font-size:13px}
.stage{max-width:1100px;margin:0 auto}
.cap{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}

/* ---------- App 外框 ---------- */
.app{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:none}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn.ghost{border-color:transparent;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);min-height:620px}
@media(max-width:760px){.split{grid-template-columns:1fr}.pane-r{display:none}}

/* ---------- 左：清單 ---------- */
.pane-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted)}
.chip small{font-family:var(--mono);margin-left:4px}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:500}
.sortrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.sortrow select{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px}
.rows{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 10px;padding:10px 14px 10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.row:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.row .bar{align-self:stretch;background:transparent;border-radius:0 3px 3px 0}
.row[aria-selected=true]{background:var(--accent-soft)}
.row[aria-selected=true] .bar{background:var(--accent)}
.row h3{margin:0;font-size:15px;line-height:1.5;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .sub{margin-top:2px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cat{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 7px;font-weight:500;font-size:12px}
.row[aria-selected=true] .cat{background:var(--surface)}
.badge{font-size:12px;white-space:nowrap;padding-top:2px;text-align:right;color:var(--muted)}
.badge.fresh{color:var(--ok);font-weight:600}
.vcount{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* ---------- 右：工作台 ---------- */
.pane-r{min-width:0;padding:16px;background:var(--bg)}
.bigcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.bigcard .meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.bigcard .used{margin-left:auto}
.bigcard .note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.bigcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.bigcard .src{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.bigcard .src .ot{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.ph{padding:14px 18px 8px;display:flex;flex-direction:column;gap:6px}
.ph .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ph .id{font-family:var(--mono)}
.ph .orig{font-size:13px;color:var(--muted);margin:0}
.ph .orig b{font-weight:500;color:var(--fg)}
.sec{padding:6px 18px 4px;font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.cards{padding:0 18px;display:flex;flex-direction:column;gap:8px}
.card{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.card:hover{border-color:var(--accent)}
.card[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:4px}
.card[aria-checked=true] .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.card .t{font-weight:700;font-size:16px;line-height:1.5;margin:0}
.card .m{font-size:12px;color:var(--muted);margin-top:2px}
.copy{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.copy:hover{background:var(--accent-soft)}
.card[aria-checked=true] .copy:hover{background:var(--surface)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.block{margin:0 18px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.block .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.block p{margin:0;font-size:14px;white-space:pre-wrap}
.block .url{font-family:var(--mono);font-size:13px;word-break:break-all}
.stack{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.dock{margin-top:auto;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center;background:var(--surface);position:sticky;bottom:0}
.dock .grow{flex:1;font-size:12px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}


.car{margin:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:grab}
.car::-webkit-scrollbar{display:none}
.car.dragging{scroll-snap-type:none;cursor:grabbing;user-select:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.slide .t{font-size:19px;font-weight:700;line-height:1.5;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.slide .m{font-size:12px;color:var(--muted)}
.carnav{margin:0;display:flex;align-items:center;gap:10px}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.arrow:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.arrow[disabled]{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.carnav .cnt{font-size:12px;color:var(--muted)}
.carnav .sp{flex:1}
</style>
</head>
<body>
<div class="banner"><b>預覽稿（尚未改動正式網站）</b>：只調整整體介面設計，和 LINE 無關，也沒有 LINE 預覽。我仍看不到你的套版產生器，版型是依常見的「左清單、右工作台」模式推測，確認方向或給截圖後再動正式程式。</div>

<div class="stage">
  <div>
    <p class="cap">電腦版：左邊清單、右邊一張大卡片，點清單就切換。改標保留換行，「複製標題」複製目前顯示的那一版，「複製留言」＝小編文（第一行）＋原始網址（第二行）。手機版為清單全寬，點進去是詳情頁。</p>
    <div class="app">
      <div class="topbar">
        <h1>熱門新聞庫</h1>
        <input class="search" placeholder="搜尋標題、小編文、編號　（按 / 快速聚焦）">
        <button class="btn primary">＋ 新增</button>
        <button class="btn ghost" aria-label="設定">⚙</button>
      </div>
      <div class="split">
        <section class="pane-l">
          <div class="filters">
            <div class="chips" id="chips"></div>
            <div class="sortrow"><span id="cnt"></span>
              <select aria-label="排序"><option>最久未用優先</option><option>最近使用優先</option><option>使用次數多到少</option><option>最新新增</option></select>
            </div>
          </div>
          <div class="rows" id="rows" role="listbox"></div>
        </section>
        <section class="pane-r">
          <article class="bigcard">
            <div class="meta"><span class="cat" id="pCat"></span><span class="id" id="pId"></span><span id="pUsed" class="used"></span></div>
            <div class="car" id="car" tabindex="0" aria-label="改標，可左右滑動或用方向鍵切換"></div>
            <div class="carnav"><button class="arrow" id="prev" aria-label="上一個改標">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="下一個改標">›</button><span class="cnt" id="vcnt"></span></div>
            <p class="note" id="pNote"></p>
            <div class="acts">
              <button class="btn copy" id="cTitle">複製標題</button>
              <button class="btn copy" id="cNote">複製留言</button>
              <button class="btn" id="mark">標記已使用</button>
              <button class="btn" id="edit">編輯</button>
            </div>
            <div class="src"><span class="tag">原始</span><span class="ot" id="pOrig"></span></div>
          </article>
        </section>
      </div>
    </div>
  </div>

</div>

<script>
var DATA=[
 {id:'4032757',cat:'社會',o:'北市清晨驚傳隨機砍人　62歲男當場落網',used:'從未使用',fresh:1,
  v:['北市驚魂！62歲男清晨持刀砍人\n警方三分鐘到場壓制','【獨家】隨機攻擊釀3傷\n嫌犯供稱「心情不好」'],note:'路人拍下警方壓制畫面，市民直呼嚇壞。'},
 {id:'1358062',cat:'健康',o:'每天一杯咖啡真的傷胃？醫師揭3種人別碰',used:'12 天前',
  v:['咖啡喝錯＝傷胃？醫曝3類人別碰'],note:'醫師提醒：空腹喝咖啡對胃酸分泌影響最大。'},
 {id:'4032101',cat:'國際',o:'日本強震規模6.8　東京搖晃明顯',used:'3 天前',
  v:['日本規模6.8強震\n東京大樓搖晃','快訊／日本強震！氣象廳：留意餘震'],note:'目前暫無傳出災情。'},
 {id:'4031988',cat:'娛樂',o:'金曲歌后宣布年底開唱　門票秒殺',used:'28 天前',
  v:['歌后年底開唱！門票開賣秒殺'],note:'粉絲搶票大塞車，官方加開場次。'},
 {id:'4031720',cat:'生活',o:'超商新品聯名開賣　限量周邊預告',used:'45 天前',
  v:['超商聯名快閃　限量周邊搶先看','便利商店新品＋周邊　開賣時間曝光'],note:'周邊數量有限，賣完為止。'}
];
var cats=['全部','社會','生活','健康','政治','國際','娛樂'],cur=0,sel=0,catSel='全部';
function $(i){return document.getElementById(i)}
function renderChips(){
  $('chips').innerHTML='';
  cats.forEach(function(c){
    var n=c==='全部'?DATA.length:DATA.filter(function(d){return d.cat===c}).length;
    var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',c===catSel);
    b.innerHTML=c+'<small>'+n+'</small>';
    b.onclick=function(){catSel=c;cur=0;sel=0;render()};
    $('chips').appendChild(b);
  });
}
function list(){return DATA.filter(function(d){return catSel==='全部'||d.cat===catSel})}
function render(){
  renderChips();
  var L=list();$('cnt').textContent='共 '+L.length+' 則';
  $('rows').innerHTML='';
  L.forEach(function(d,i){
    var r=document.createElement('div');r.className='row';r.setAttribute('role','option');r.setAttribute('aria-selected',i===cur);
    r.innerHTML='<span class="bar"></span><div><h3>'+d.v[0].replace(/\n/g,' ')+'</h3><div class="sub"><span class="cat">'+d.cat+'</span><span>'+d.id+'</span>'+(d.v.length>1?'<span class="vcount">'+d.v.length+' 版</span>':'')+'</div></div><div class="badge'+(d.fresh?' fresh':'')+'">'+d.used+'</div>';
    r.onclick=function(){cur=i;sel=0;render()};
    $('rows').appendChild(r);
  });
  var d=L[cur]||L[0];if(!d)return;
  $('pCat').textContent=d.cat;$('pId').textContent=d.id;$('pUsed').textContent='上次使用：'+d.used;
  $('pOrig').textContent=d.o;$('pNote').textContent=d.note;
    var car=$('car');car.innerHTML='';car.className='car';
  d.v.forEach(function(t,i){
    var c=document.createElement('div');c.className='slide';
    c.innerHTML='<p class="t">'+t+'</p><div class="m">版本 '+(i+1)+'・'+t.length+' 字</div>';
    car.appendChild(c);
  });
  $('dots').innerHTML='';
  d.v.forEach(function(_,i){var x=document.createElement('span');x.className='dot'+(i===sel?' on':'');$('dots').appendChild(x)});
  var multi=d.v.length>1;
  $('prev').hidden=$('next').hidden=$('dots').hidden=!multi;
  function sync(){
    var w=car.clientWidth||1;sel=Math.max(0,Math.min(d.v.length-1,Math.round(car.scrollLeft/w)));
    [].forEach.call($('dots').children,function(x,i){x.classList.toggle('on',i===sel)});
    $('prev').disabled=sel===0;$('next').disabled=sel===d.v.length-1;
    $('vcnt').textContent=multi?(sel+1)+' / '+d.v.length:'';
  }
  function go(i){car.scrollTo({left:i*car.clientWidth,behavior:'smooth'})}
  car.onscroll=sync;
  $('prev').onclick=function(){go(sel-1)};$('next').onclick=function(){go(sel+1)};
  car.onkeydown=function(e){if(e.key==='ArrowLeft'){go(sel-1);e.preventDefault()}if(e.key==='ArrowRight'){go(sel+1);e.preventDefault()}};
  if(multi){ /* 滑鼠按住拖曳 */
    var down=0,x0=0,s0=0;
    car.onpointerdown=function(e){if(e.pointerType!=='mouse')return;down=1;x0=e.clientX;s0=car.scrollLeft};
    car.onpointermove=function(e){if(!down)return;if(Math.abs(e.clientX-x0)>4)car.classList.add('dragging');car.scrollLeft=s0-(e.clientX-x0)};
    var up=function(){if(!down)return;down=0;car.classList.remove('dragging');go(sel)};
    car.onpointerup=car.onpointercancel=car.onpointerleave=up;
  }
  car.scrollLeft=sel*car.clientWidth;sync();
}
window.lastCopied='';
function flash(b,t){var o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent=t;setTimeout(function(){b.textContent=o},1200)}
function doCopy(b,text,msg){window.lastCopied=text;try{navigator.clipboard.writeText(text).catch(function(){})}catch(e){}flash(b,msg)}
$('cTitle').onclick=function(){var d=list()[cur];doCopy(this,d.v[sel],d.v.length>1?'已複製第 '+(sel+1)+' 版標題 ✓':'已複製標題 ✓')};
$('cNote').onclick=function(){var d=list()[cur];doCopy(this,d.note+'\nhttps://news.tvbs.com.tw/news/'+d.id,'已複製留言 ✓')};
$('mark').onclick=function(){var d=list()[cur];d.used='剛剛';d.fresh=0;render()};
render();
</script>
</body>
</html>
