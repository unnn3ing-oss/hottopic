<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熱門新聞庫｜介面改版預覽</title>
<style>
:root{
  --bg:#f4f7fc; --surface:#fff; --ink:#1b2a4e; --muted:#66779c; --line:#d5e0f2; --edge:#a9c2ee;
  --soft:#eef3fb; --track:#e9eff9; --blue:#0b4aa8; --blue-fg:#fff; --glow:rgba(70,130,225,.18);
  --ok:#1c7a45; --red:#d93636; --warn-bg:#fdf1d8; --warn:#8a5a00;
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#161e33;--ink:#e6ecfa;--muted:#93a3c7;--line:#27345a;--edge:#3b5aa0;
  --soft:#1c2744;--track:#1f2b4a;--blue:#5b9bff;--blue-fg:#07152e;--glow:rgba(91,155,255,.2);--ok:#6fd49a;--red:#ff7d7d;--warn-bg:#3a2f12;--warn:#f0d28a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
.banner{max-width:1100px;margin:0 auto 14px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 14px;font-size:13px}
.stage{max-width:1100px;margin:0 auto}
.cap{font-size:12px;color:var(--muted);margin:0 0 6px}

.app{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;font-weight:800;flex:none}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font:inherit;color:inherit}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px;font-size:14px;font-weight:600;line-height:1.4;color:var(--ink)}
.pill:hover{border-color:var(--edge)}
.pill.solid{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.pill.icon{padding:5px 11px}

.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);min-height:600px}
@media(max-width:820px){.split{grid-template-columns:1fr}.pane-r{display:none}}

/* 左：清單 */
.pane-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:1px 12px;font-size:13px;color:var(--muted)}
.chip small{font-family:var(--mono);margin-left:4px}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blue-fg);border-color:var(--blue);font-weight:600}
.sortrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.sortrow select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px}
.rows{overflow:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.row{border:1.5px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.row:hover{background:var(--soft)}
.row[aria-selected=true]{background:var(--soft);border-color:var(--edge)}
.row h3{margin:0;font-size:14.5px;line-height:1.45;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cat{background:var(--soft);color:var(--blue);border-radius:999px;padding:0 9px;font-weight:600;font-size:12px}
.row[aria-selected=true] .cat{background:var(--surface)}
.badge{font-size:12px;white-space:nowrap;color:var(--muted);padding-top:1px}
.badge.fresh{color:var(--ok);font-weight:700}
.vcount{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px}

/* 右：一張橫式大卡片（外框參考你的截圖） */
.pane-r{min-width:0;padding:16px;background:var(--bg);display:flex}
.bigcard{background:var(--surface);border:1.5px solid var(--edge);border-radius:22px;box-shadow:0 0 0 4px var(--glow);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chev{width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--blue-fg);border:0;font-size:13px;display:grid;place-items:center;padding:0}
.ctitle{font-weight:800;font-size:16px}
.ctitle small{font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:6px;font-size:13px}
.cacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grow{flex:1}
.grow .car{flex:1}
.pill.copied{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);color:var(--red);background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:800;padding:0}
.cbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1000px){.cbody{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:800;font-size:15px}
.lbl small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.box{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 14px;min-width:0}

/* 改標滑動區 */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;border:1.5px solid var(--line);border-radius:14px;cursor:grab;background:var(--surface)}
.car::-webkit-scrollbar{display:none}
.car.dragging{scroll-snap-type:none;cursor:grabbing;user-select:none}
.car:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;padding:16px 18px;min-height:190px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.slide .t{font-size:20px;font-weight:800;line-height:1.5;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.slide .m{font-size:12px;color:var(--muted)}
.stepper_old{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.circ{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;color:var(--ink)}
.circ:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.circ[disabled]{opacity:.35;cursor:not-allowed}
.num{height:40px;border:1.5px solid var(--line);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16px}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--blue)}
.hint{font-size:12px;color:var(--muted)}

/* 右欄：小編文、紀錄 */
.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:0}
.note.empty{color:var(--muted)}
.rec{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.rec b{color:var(--ink);font-weight:700}
.rec .never{color:var(--ok)}
.orig{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:-8px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;flex:none;margin-top:3px}

.carwrap{position:relative;flex:1;display:flex}
.carwrap .car{flex:1}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 2px 8px rgba(20,40,90,.15)}
.arrow.l{left:8px}.arrow.r{right:8px}
.bigcard:hover .arrow,.arrow:focus-visible{opacity:1;pointer-events:auto}
@media(hover:none){.arrow{opacity:1;pointer-events:auto}}
.arrow:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.arrow[disabled]{opacity:0!important;pointer-events:none}
.dots{justify-content:center;margin-top:2px}
.dot{width:9px;height:9px;padding:0;border:0;cursor:pointer}
.slide{align-items:center;justify-content:center!important;text-align:center;padding:18px 54px!important}
.slide .t{text-align:center}

/* 右側卡片採 2/3 尺寸（等比縮小），左邊清單吃掉剩餘空間 */
.split{grid-template-columns:minmax(0,1fr) auto!important;min-height:0}
.pane-r{display:block;align-self:start}
.bigcard{width:740px;min-height:0;zoom:.667}
.slide{min-height:140px}
@media(max-width:820px){.split{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="banner"><b>預覽稿（尚未改動正式網站）</b>：依你的標註調整——使用次數移到卡片右上；原始標題移到新聞編號下方（灰色小字）；小編文改為改標下方的純文字；按鈕移到卡片右下；卡片整體加高。</div>
<div class="stage">
  <p class="cap">電腦版：左邊清單，右邊一張大卡片（2/3 尺寸）。改標保留換行、可左右滑動，也可按 ‹ ›；「複製留言」＝小編文（第一行）＋原始網址（第二行）。</p>
  <div class="app">
    <div class="topbar">
      <h1>熱門新聞庫</h1>
      <input class="search" placeholder="搜尋標題、小編文、編號">
      <button class="pill solid">＋ 新增新聞</button>
      <button class="pill icon" aria-label="設定">⚙</button>
    </div>
    <div class="split">
      <section class="pane-l">
        <div class="filters">
          <div class="chips" id="chips"></div>
          <div class="sortrow"><span id="cnt"></span>
            <select aria-label="排序"><option>最久未用優先</option><option>最近使用優先</option><option>使用次數多到少</option><option>最新新增</option></select>
          </div>
        </div>
        <div class="rows" id="rows" role="listbox"></div>
      </section>
      <section class="pane-r">
        <article class="bigcard">
          <div class="chead">
            <button class="chev" aria-label="收合">⌃</button>
            <span class="ctitle">新聞<small id="pId"></small></span>
            <span class="cat" id="pCat"></span>
            <div class="rec" id="rec"></div>
          </div>
          <div class="orig"><span class="tag">原始</span><span id="pOrig"></span></div>
          <div class="field grow">
            <span class="lbl">改標<small>左右滑動，或按 ‹ ›</small></span>
            <div class="carwrap">
              <div class="car" id="car" tabindex="0" aria-label="改標，可左右滑動或用方向鍵切換"></div>
              <button class="arrow l" id="prev" aria-label="上一個改標">‹</button>
              <button class="arrow r" id="next" aria-label="下一個改標">›</button>
            </div>
            <div class="dots" id="dots" role="tablist" aria-label="切換改標"></div>
            <span class="hint" id="vhint"></span>
          </div>
          <div class="field">
            <span class="lbl">小編文</span>
            <p class="note" id="pNote"></p>
          </div>
          <div class="cacts">
            <button class="pill" id="cTitle">複製標題</button>
            <button class="pill" id="cNote">複製留言</button>
            <button class="pill solid" id="mark">標記已使用</button>
            <button class="pill" id="edit">編輯</button>
          </div>
        </article>
      </section>
    </div>
  </div>
</div>
<script>
var DATA=[
 {id:'4032757',cat:'社會',o:'北市清晨驚傳隨機砍人　62歲男當場落網',used:'從未使用',fresh:1,
  v:['北市驚魂！62歲男清晨持刀砍人\n警方三分鐘到場壓制','【獨家】隨機攻擊釀3傷\n嫌犯供稱「心情不好」'],note:'路人拍下警方壓制畫面，市民直呼嚇壞。'},
 {id:'1358062',cat:'健康',o:'每天一杯咖啡真的傷胃？醫師揭3種人別碰',used:'12 天前',
  v:['咖啡喝錯＝傷胃？\n醫曝3類人別碰'],note:'醫師提醒：空腹喝咖啡對胃酸分泌影響最大。'},
 {id:'4032101',cat:'國際',o:'日本強震規模6.8　東京搖晃明顯',used:'3 天前',
  v:['日本規模6.8強震\n東京大樓搖晃','快訊／日本強震！\n氣象廳：留意餘震'],note:'目前暫無傳出災情。'},
 {id:'4031988',cat:'娛樂',o:'金曲歌后宣布年底開唱　門票秒殺',used:'28 天前',
  v:['歌后年底開唱！\n門票開賣秒殺'],note:'粉絲搶票大塞車，官方加開場次。'},
 {id:'4031720',cat:'生活',o:'超商新品聯名開賣　限量周邊預告',used:'45 天前',
  v:['超商聯名快閃\n限量周邊搶先看','便利商店新品＋周邊\n開賣時間曝光'],note:''}
];
var cats=['全部','社會','生活','健康','政治','國際','娛樂'],cur=0,sel=0,catSel='全部';
function $(i){return document.getElementById(i)}
function list(){return DATA.filter(function(d){return catSel==='全部'||d.cat===catSel})}
function renderChips(){
  $('chips').innerHTML='';
  cats.forEach(function(c){
    var n=c==='全部'?DATA.length:DATA.filter(function(d){return d.cat===c}).length;
    var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',c===catSel);
    b.innerHTML=c+'<small>'+n+'</small>';
    b.onclick=function(){catSel=c;cur=0;sel=0;render()};
    $('chips').appendChild(b);
  });
}
function render(){
  renderChips();
  var L=list();$('cnt').textContent='共 '+L.length+' 則';
  $('rows').innerHTML='';
  L.forEach(function(d,i){
    var r=document.createElement('div');r.className='row';r.setAttribute('role','option');r.setAttribute('aria-selected',i===cur);
    r.innerHTML='<h3>'+d.v[0].replace(/\n/g,' ')+'</h3><div class="badge'+(d.fresh?' fresh':'')+'">'+d.used+'</div><div class="sub"><span class="cat">'+d.cat+'</span><span>'+d.id+'</span>'+(d.v.length>1?'<span class="vcount">'+d.v.length+' 版</span>':'')+'</div>';
    r.onclick=function(){cur=i;sel=0;render()};
    $('rows').appendChild(r);
  });
  var d=L[cur]||L[0];if(!d)return;
  $('pCat').textContent=d.cat;$('pId').textContent='#'+d.id;$('pOrig').textContent=d.o;
  $('pNote').textContent=d.note||'（尚無小編文）';$('pNote').className='note'+(d.note?'':' empty');
  $('rec').innerHTML=d.fresh?'<b class="never">從未使用</b> · 使用 0 次':'上次使用 <b>'+d.used+'</b> · 共 2 次';
  var car=$('car');car.innerHTML='';car.className='car';
  d.v.forEach(function(t,i){
    var c=document.createElement('div');c.className='slide';
    c.innerHTML='<p class="t"></p><div class="m">'+(i%2?'此版本上次使用 3 天前 · 1 次':'此版本尚未使用')+'</div>';
    c.firstChild.textContent=t;car.appendChild(c);
  });
  $('dots').innerHTML='';
  d.v.forEach(function(_,i){var x=document.createElement('button');x.className='dot'+(i===sel?' on':'');x.setAttribute('aria-label','第 '+(i+1)+' 版');x.onclick=function(){go(i)};$('dots').appendChild(x)});
  var multi=d.v.length>1;
  $('prev').hidden=$('next').hidden=!multi;$('dots').hidden=!multi;
  $('vhint').textContent=multi?'複製標題＝目前顯示的這一版；標記已使用會記在這一版和整則新聞上':'';
  function sync(){
    var w=car.clientWidth||1;sel=Math.max(0,Math.min(d.v.length-1,Math.round(car.scrollLeft/w)));
    [].forEach.call($('dots').children,function(x,i){x.classList.toggle('on',i===sel)});
    $('prev').disabled=sel===0;$('next').disabled=sel===d.v.length-1;
  }
  function go(i){car.scrollTo({left:i*car.clientWidth,behavior:'smooth'})}
  car.onscroll=sync;
  $('prev').onclick=function(){go(sel-1)};$('next').onclick=function(){go(sel+1)};
  car.onkeydown=function(e){if(e.key==='ArrowLeft'){go(sel-1);e.preventDefault()}if(e.key==='ArrowRight'){go(sel+1);e.preventDefault()}};
  if(multi){
    var down=0,x0=0,s0=0;
    car.onpointerdown=function(e){if(e.pointerType!=='mouse')return;down=1;x0=e.clientX;s0=car.scrollLeft};
    car.onpointermove=function(e){if(!down)return;if(Math.abs(e.clientX-x0)>4)car.classList.add('dragging');car.scrollLeft=s0-(e.clientX-x0)};
    var up=function(){if(!down)return;down=0;car.classList.remove('dragging');go(sel)};
    car.onpointerup=car.onpointercancel=car.onpointerleave=up;
  }
  car.scrollLeft=sel*car.clientWidth;sync();
}
window.lastCopied='';
function flash(b,t){var o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent=t;b.classList.add('copied');setTimeout(function(){b.textContent=o;b.classList.remove('copied')},1200)}
function doCopy(b,text,msg){window.lastCopied=text;try{navigator.clipboard.writeText(text).catch(function(){})}catch(e){}flash(b,msg)}
$('cTitle').onclick=function(){var d=list()[cur];doCopy(this,d.v[sel],d.v.length>1?'已複製第 '+(sel+1)+' 版 ✓':'已複製標題 ✓')};
$('cNote').onclick=function(){var d=list()[cur];doCopy(this,(d.note?d.note+'\n':'')+'https://news.tvbs.com.tw/news/'+d.id,'已複製留言 ✓')};
$('mark').onclick=function(){var d=list()[cur];d.used='剛剛';d.fresh=0;render()};
render();
</script>
</body>
</html>
