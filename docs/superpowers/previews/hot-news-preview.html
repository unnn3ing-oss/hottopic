<title>熱門新聞庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄工具列表。每則新聞的主角是可左右滑動的「改標」區，原始標題縮小當參考。 */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dde1dd;
  --accent:#0d6b5c; --accent-fg:#ffffff; --accent-soft:#e1f0ec;
  --warn-bg:#fdf1d8; --warn-fg:#6b4a00; --ok:#1c7a45; --danger:#b3261e;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2c342f;
  --accent:#4fc2ac; --accent-fg:#06211b; --accent-soft:#1a2f2a;
  --warn-bg:#3a2f12; --warn-fg:#f0d28a; --ok:#6fd49a; --danger:#f2877f; color-scheme:dark;}}
:root[data-theme="dark"]{--danger:#f2877f;
  --bg:#121614; --surface:#1b211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2c342f;
  --accent:#4fc2ac; --accent-fg:#06211b; --accent-soft:#1a2f2a;
  --warn-bg:#3a2f12; --warn-fg:#f0d28a; --ok:#6fd49a; color-scheme:dark;}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn.copy{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:500}
.btn.copy:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.confirm{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-fg)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;margin-right:auto}
.btn.danger.armed{background:var(--danger);color:var(--bg);font-weight:500}
.btn.small{padding:2px 10px;font-size:13px}

.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:500}
.chip small{font-family:var(--font-mono);margin-left:4px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item+.item{border-top:1px solid var(--line)}
.meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.id{font-family:var(--font-mono);font-size:12px}
.cat{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 8px;font-weight:500;font-size:12px}
.used{margin-left:auto;text-align:right}
.used b{color:var(--fg);font-weight:500}
.used.never b{color:var(--ok)}

.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;
  background:var(--bg);border-radius:8px}
.car::-webkit-scrollbar{display:none}
.car.multi{cursor:grab}
.car.dragging{scroll-snap-type:none;cursor:grabbing;user-select:none;-webkit-user-select:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.title{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.title.empty{font-weight:400;color:var(--muted);font-size:15px}
.vinfo{font-size:12px;color:var(--muted)}
.carnav{display:flex;align-items:center;gap:8px}
.arrow{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1}
.dots{display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.cnt{font-size:12px;color:var(--muted);margin-left:4px}

.src{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.src .ot{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src a.link{flex:none}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note.empty{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.link{font-size:13px;color:var(--accent)}
.none{padding:32px 16px;text-align:center;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{display:flex;flex-direction:column;gap:12px;padding:20px}
form h2{margin:0;font-size:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--fg);font-size:15px}
label textarea{resize:vertical;min-height:72px;line-height:1.5}
input[readonly]{opacity:.65}
#vars{display:flex;flex-direction:column;gap:12px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);min-height:18px}
.hint.warn{color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:4px 8px}
.hint button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
@media (max-width:480px){.used{margin-left:0;text-align:left;width:100%}}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>熱門新聞庫 <span class="badge">預覽版・範例資料</span></h1>
    <button class="btn primary" id="addBtn" type="button">＋ 新增新聞</button>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="搜尋標題、小編文、編號" aria-label="搜尋">
    <select id="sort" aria-label="排序">
      <option value="oldest">最久未用優先</option>
      <option value="recent">最近使用優先</option>
      <option value="count">使用次數多到少</option>
      <option value="created">最新新增</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <p class="foot">預覽版：資料只存在這個畫面，重新整理會還原。有多個改標時，手機用手指左右滑動；電腦可用滑鼠按住拖曳、觸控板橫滑、方向鍵 ←/→，或按 ‹ › 切換。「複製標題」複製目前顯示的那一版；「標記已使用」會記錄在目前顯示的那一版和整則新聞上。複製留言的網址格式：https://news.tvbs.com.tw/news/編號</p>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增新聞</h2>
    <label>原文網址
      <input id="fUrl" type="url" placeholder="https://news.tvbs.com.tw/cars/4032757" autocomplete="off">
    </label>
    <div class="hint" id="idHint"></div>
    <label>分類
      <select id="fCat"></select>
    </label>
    <label>原始標題（建立後不可修改）
      <input id="fOrig" type="text" autocomplete="off">
    </label>
    <div id="vars"></div>
    <button class="btn" type="button" id="addVar">＋ 新增一個改標</button>
    <label>小編文（整則新聞共用）
      <textarea id="fNote"></textarea>
    </label>
    <div class="hint warn" id="err" hidden></div>
    <div class="row">
      <button class="btn danger" type="button" id="del" hidden>刪除這則</button>
      <button class="btn" type="button" id="cancel">取消</button>
      <button class="btn primary" type="submit" id="save">儲存</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden></div>

<script>
var BASE = 'https://news.tvbs.com.tw/news/';
var CATS = ['社會','生活','健康','政治','國際','娛樂'];
var DAY = 864e5, NOW = Date.now(), seq = 100;
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function V(t,last,count){return {t:t,last:last,count:count}}
var items = [
  {id:'4032757', cat:'生活', url:'https://news.tvbs.com.tw/cars/4032757',
   orig:'汽車定期保養別再等到出問題！內行人揭 5 項最容易被忽略的檢查重點',
   titles:[V('定期保養的 5 個重點\n第 3 項最多人漏掉',NOW-20*DAY,2),
           V('愛車多久該保養一次？\n行家：別等警示燈亮',NOW-9*DAY,1),
           V('保養千萬別省！\n這 5 項檢查最容易被漏掉',null,0)],
   note:'你多久保養一次車？\n留言分享你的習慣 👇', last:NOW-9*DAY, count:3, created:NOW-30*DAY},
  {id:'4031880', cat:'社會', url:'https://news.tvbs.com.tw/local/4031880',
   orig:'夜市攤販連假湧入人潮 業者喊「一晚賣出平常三天的量」',
   titles:[V('連假夜市爆滿\n攤商：一晚抵三天',null,0)],
   note:'你最推薦哪一攤？', last:null, count:0, created:NOW-2*DAY},
  {id:'4030112', cat:'健康', url:'https://news.tvbs.com.tw/health/4030112',
   orig:'醫師提醒：天氣轉涼早晨血壓容易飆高 3 類人要特別注意',
   titles:[V('天氣轉涼\n這 3 類人早上要量血壓',NOW-1*DAY-3600e3,1),
           V('早晨血壓飆高！\n醫師點名 3 類人要小心',null,0)],
   note:'家裡長輩有在量血壓嗎？\n轉給他們看看。', last:NOW-1*DAY-3600e3, count:1, created:NOW-12*DAY},
  {id:'4029554', cat:'生活', url:'https://news.tvbs.com.tw/life/4029554',
   orig:'超商秋季新品開賣 網友票選最想吃的 3 款',
   titles:[V('超商秋季新品開賣\n你會先吃哪一款？',NOW-21*DAY,2)],
   note:'', last:NOW-21*DAY, count:2, created:NOW-40*DAY},
  {id:'4028301', cat:'社會', url:'https://news.tvbs.com.tw/local/4028301',
   orig:'捷運末班車延後營運 跨年夜加開班次時間一次看',
   titles:[], note:'', last:null, count:0, created:NOW-1*DAY}
];
var state = {cat:'全部', q:'', sort:'oldest', editing:null, pendingMark:null, pos:{}, draft:[]};

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function fmt(ms){var d=new Date(ms);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function ago(ms){var d=Math.floor((Date.now()-ms)/DAY);return d<=0?'今天':d+' 天前'}
function extractId(url){var m=(url||'').replace(/[?#].*$/,'').match(/\d+/g);if(!m)return null;
  return m.reduce(function(a,b){return b.length>a.length?b:a})}
function posOf(it){var n=it.titles.length;return Math.min(state.pos[it.id]||0,Math.max(n-1,0))}
function byId(id){return items.filter(function(i){return i.id===id})[0]}

function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},1800)}
function copyText(text,okMsg){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);toast(ok?okMsg:'複製失敗，請手動選取');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fallback);
  }else fallback();
}

function visible(){
  var q=state.q.trim().toLowerCase();
  var r=items.filter(function(it){
    if(state.cat!=='全部'&&it.cat!==state.cat)return false;
    if(!q)return true;
    var all=it.id+' '+it.orig+' '+it.note+' '+it.titles.map(function(v){return v.t}).join(' ');
    return all.toLowerCase().indexOf(q)>-1;
  });
  var s=state.sort;
  r.sort(function(a,b){
    if(s==='oldest'){var x=a.last==null?-1:a.last,y=b.last==null?-1:b.last;return x-y}
    if(s==='recent'){return (b.last||0)-(a.last||0)}
    if(s==='count'){return b.count-a.count}
    return b.created-a.created;
  });
  return r;
}

function renderChips(){
  var all=['全部'].concat(CATS);
  $('chips').innerHTML=all.map(function(c){
    var n=c==='全部'?items.length:items.filter(function(i){return i.cat===c}).length;
    return '<button type="button" class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(state.cat===c)+'">'+esc(c)+'<small>'+n+'</small></button>';
  }).join('');
}

function render(){
  drag=null;
  renderChips();
  var r=visible();
  if(!r.length){$('list').innerHTML='<div class="none">沒有符合的新聞。調整搜尋或分類，或按「＋ 新增新聞」。</div>';return}
  $('list').innerHTML=r.map(function(it){
    var n=it.titles.length,p=posOf(it);
    var used=it.last==null
      ?'<span class="used never"><b>從未使用</b> · 使用 0 次</span>'
      :'<span class="used">上次使用 <b>'+fmt(it.last)+'</b>（'+ago(it.last)+'）· 共 '+it.count+' 次</span>';
    var confirming=state.pendingMark&&state.pendingMark.id===it.id&&state.pendingMark.idx===p;
    var head,nav='';
    if(!n){head='<p class="title empty">（尚未改標）</p>'}
    else{
      head='<div class="car'+(n>1?' multi':'')+'" tabindex="0" aria-label="'+(n>1?'改標，可左右滑動或用方向鍵切換':'改標')+'">'+it.titles.map(function(v){
        var info=v.last==null?'此版本尚未使用':'此版本上次使用 '+fmt(v.last)+' · '+v.count+' 次';
        return '<div class="slide"><p class="title">'+esc(v.t)+'</p><div class="vinfo">'+info+'</div></div>';
      }).join('')+'</div>';
      if(n>1){
        nav='<div class="carnav"><button type="button" class="btn arrow" data-act="prev" aria-label="上一個改標"'+(p===0?' disabled':'')+'>‹</button>'+
          '<span class="dots">'+it.titles.map(function(_,i){return '<span class="dot'+(i===p?' on':'')+'"></span>'}).join('')+'</span>'+
          '<button type="button" class="btn arrow" data-act="next" aria-label="下一個改標"'+(p===n-1?' disabled':'')+'>›</button>'+
          '<span class="cnt">第 '+(p+1)+' / '+n+' 版</span></div>';
      }
    }
    return '<article class="item" data-id="'+esc(it.id)+'">'+
      '<div class="meta"><span class="id">#'+esc(it.id)+'</span><span class="cat">'+esc(it.cat)+'</span>'+used+'</div>'+
      head+nav+
      (it.note?'<p class="note">'+esc(it.note)+'</p>':'<p class="note empty">（尚無小編文）</p>')+
      '<div class="acts">'+
        '<button type="button" class="btn copy" data-act="ctitle"'+(n?'':' disabled')+'>複製標題</button>'+
        '<button type="button" class="btn copy" data-act="cnote">複製留言</button>'+
        '<button type="button" class="btn'+(confirming?' confirm':'')+'" data-act="mark">'+(confirming?'再按一次確認'+(n>1?'（第 '+(p+1)+' 版）':''):'標記已使用')+'</button>'+
        '<button type="button" class="btn" data-act="edit">編輯</button>'+
        '<div class="src" title="'+esc(it.orig)+'"><span class="tag">原始</span><span class="ot">'+esc(it.orig)+'</span><a class="link" href="'+esc(it.url)+'" target="_blank" rel="noopener">原文 ↗</a></div>'+
      '</div></article>';
  }).join('');
  Array.prototype.forEach.call($('list').querySelectorAll('.car'),function(car){
    var it=byId(car.closest('.item').getAttribute('data-id'));
    car.scrollLeft=posOf(it)*car.clientWidth;
  });
}

/* 輪播同步：滑動後更新目前第幾版、圓點、箭頭 */
function syncNav(itemEl,idx,n){
  var dots=itemEl.querySelectorAll('.dot');
  Array.prototype.forEach.call(dots,function(d,i){d.classList.toggle('on',i===idx)});
  var prev=itemEl.querySelector('[data-act=prev]'),next=itemEl.querySelector('[data-act=next]');
  if(prev)prev.disabled=idx===0;if(next)next.disabled=idx===n-1;
  var cnt=itemEl.querySelector('.cnt');if(cnt)cnt.textContent='第 '+(idx+1)+' / '+n+' 版';
}
$('list').addEventListener('scroll',function(e){
  var car=e.target;if(!car.classList||!car.classList.contains('car'))return;
  cancelAnimationFrame(car._r);
  car._r=requestAnimationFrame(function(){
    var w=car.clientWidth;if(!w)return;
    var itemEl=car.closest('.item'),id=itemEl.getAttribute('data-id'),it=byId(id);
    var idx=Math.max(0,Math.min(it.titles.length-1,Math.round(car.scrollLeft/w)));
    state.pos[id]=idx;syncNav(itemEl,idx,it.titles.length);
    var pm=state.pendingMark;
    if(pm&&pm.id===id&&pm.idx!==idx){
      state.pendingMark=null;var b=itemEl.querySelector('[data-act=mark]');b.textContent='標記已使用';b.classList.remove('confirm');
    }
  });
},true);

/* 切換改標：手指與觸控板橫滑交給瀏覽器原生處理，這裡補上滑鼠拖曳、橫向滾輪與方向鍵 */
var drag=null;
function stepOf(car){return car.children.length>1?car.children[1].offsetLeft-car.children[0].offsetLeft:car.clientWidth}
function idxOf(car){return Math.max(0,Math.min(car.children.length-1,Math.round(car.scrollLeft/stepOf(car))))}
function goTo(car,i){
  i=Math.max(0,Math.min(car.children.length-1,i));
  car.scrollTo({left:i*stepOf(car),behavior:REDUCED?'auto':'smooth'});
}
function animateScroll(car,to,done){
  var from=car.scrollLeft,t0=performance.now(),dur=REDUCED?0:220;
  if(!dur||Math.abs(to-from)<1){car.scrollLeft=to;done();return}
  (function tick(now){
    var k=Math.min(1,(now-t0)/dur);
    car.scrollLeft=from+(to-from)*(1-Math.pow(1-k,3));
    if(k<1)requestAnimationFrame(tick);else done();
  })(t0);
}
$('list').addEventListener('pointerdown',function(e){
  if(e.pointerType!=='mouse'||e.button!==0)return;
  var car=e.target.closest('.car');
  if(!car||car.children.length<2||car._busy)return;
  drag={car:car,x:e.clientX,left:car.scrollLeft,start:idxOf(car)};
  car.classList.add('dragging');
  var sel=window.getSelection&&window.getSelection();if(sel)sel.removeAllRanges();
  try{car.setPointerCapture(e.pointerId)}catch(_){}
});
$('list').addEventListener('pointermove',function(e){
  if(drag)drag.car.scrollLeft=drag.left-(e.clientX-drag.x);
});
function endDrag(e){
  if(!drag)return;
  var car=drag.car,step=stepOf(car),moved=drag.x-e.clientX,target=drag.start;
  drag=null;
  if(Math.abs(moved)>Math.min(60,step*0.15))target+=moved>0?1:-1;   // 拖過約 15%（最多 60px）就換到下一版或上一版
  target=Math.max(0,Math.min(car.children.length-1,target));
  car._busy=true;
  animateScroll(car,target*step,function(){car._busy=false;car.classList.remove('dragging')});
}
$('list').addEventListener('pointerup',endDrag);
$('list').addEventListener('pointercancel',endDrag);
$('list').addEventListener('wheel',function(e){
  var car=e.target.closest&&e.target.closest('.car');
  if(!car||car.children.length<2)return;
  var k=e.deltaMode===1?16:1,dx=e.deltaX*k,dy=e.deltaY*k;
  if(e.shiftKey&&Math.abs(dy)>Math.abs(dx)){dx=dy;dy=0}
  if(Math.abs(dx)<=Math.abs(dy))return;            // 以直向為主就交給頁面捲動
  e.preventDefault();
  var now=performance.now();
  if(now-(car._lastWheel||0)>120){car._done=false;car._acc=0}   // 事件停止 120ms 以上才算新的一次橫滑
  car._lastWheel=now;
  if(car._done)return;                                          // 同一次橫滑（含觸控板慣性）只換一版
  car._acc+=dx;
  if(Math.abs(car._acc)<30)return;
  car._done=true;
  goTo(car,idxOf(car)+(car._acc>0?1:-1));
},{passive:false});
$('list').addEventListener('keydown',function(e){
  var car=e.target.closest&&e.target.closest('.car');
  if(!car||car.children.length<2||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;
  e.preventDefault();goTo(car,idxOf(car)+(e.key==='ArrowRight'?1:-1));
});

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var itemEl=b.closest('.item'),id=itemEl.getAttribute('data-id'),it=byId(id);
  var act=b.getAttribute('data-act'),p=posOf(it);
  if(act==='ctitle'){copyText(it.titles[p].t,it.titles.length>1?'已複製第 '+(p+1)+' 版標題':'已複製標題')}
  else if(act==='cnote'){copyText((it.note?it.note+'\n':'')+BASE+it.id,'已複製留言')}
  else if(act==='edit'){openDlg(it)}
  else if(act==='prev'||act==='next'){
    var car=itemEl.querySelector('.car'),t=Math.max(0,Math.min(it.titles.length-1,p+(act==='next'?1:-1)));
    car.scrollTo({left:t*car.clientWidth,behavior:REDUCED?'auto':'smooth'});
  }
  else if(act==='mark'){
    var pm=state.pendingMark;
    if(pm&&pm.id===id&&pm.idx===p){
      var now=Date.now();it.last=now;it.count+=1;
      var v=it.titles[p];if(v){v.last=now;v.count+=1}
      state.pendingMark=null;render();
      toast(v?'已記錄第 '+(p+1)+' 版使用，此版本共 '+v.count+' 次':'已標記使用，共 '+it.count+' 次');
    }else{
      state.pendingMark={id:id,idx:p};render();
      clearTimeout(render.t);render.t=setTimeout(function(){
        var c=state.pendingMark;if(c&&c.id===id){state.pendingMark=null;render()}},3000);
    }
  }
});
$('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;state.cat=b.getAttribute('data-cat');render()});
$('q').addEventListener('input',function(e){state.q=e.target.value;render()});
$('sort').addEventListener('change',function(e){state.sort=e.target.value;render()});

/* 新增／編輯 */
$('fCat').innerHTML=CATS.map(function(c){return '<option>'+c+'</option>'}).join('');
function renderVars(){
  var d=state.draft;
  $('vars').innerHTML=d.map(function(v,i){
    return '<div class="v"><label>改標 '+(i+1)+'（可換行，顯示和複製都會保留）<textarea data-i="'+i+'">'+esc(v.t)+'</textarea></label>'+
      '<div class="vrow"><span class="vinfo">'+(v.count?'已使用 '+v.count+' 次':'尚未使用')+'</span>'+
      (d.length>1?'<button type="button" class="btn small" data-rm="'+i+'">移除這版</button>':'')+'</div></div>';
  }).join('');
}
$('vars').addEventListener('input',function(e){var i=e.target.getAttribute('data-i');if(i!==null)state.draft[+i].t=e.target.value});
$('vars').addEventListener('click',function(e){
  var b=e.target.closest('[data-rm]');if(!b)return;
  state.draft.splice(+b.getAttribute('data-rm'),1);renderVars();
});
$('addVar').addEventListener('click',function(){
  state.draft.push(V('',null,0));renderVars();
  var t=$('vars').querySelectorAll('textarea');t[t.length-1].focus();
});
function openDlg(it){
  state.editing=it||null;
  state.draft=it?it.titles.map(function(v){return V(v.t,v.last,v.count)}):[V('',null,0)];
  if(!state.draft.length)state.draft.push(V('',null,0));
  $('dlgTitle').textContent=it?'編輯 #'+it.id:'新增新聞';
  $('fUrl').value=it?it.url:'';$('fUrl').readOnly=!!it;
  $('fOrig').value=it?it.orig:'';$('fOrig').readOnly=!!it;
  $('fCat').value=it?it.cat:CATS[0];
  $('fNote').value=it?it.note:'';
  $('err').hidden=true;resetDel();$('del').hidden=!it;renderVars();checkUrl();$('dlg').showModal();
}
function resetDel(){var b=$('del');b.textContent='刪除這則';b.classList.remove('armed');clearTimeout(resetDel.t)}
$('del').addEventListener('click',function(){
  var b=$('del'),it=state.editing;if(!it)return;
  if(!b.classList.contains('armed')){
    b.textContent='再按一次刪除（無法復原）';b.classList.add('armed');
    clearTimeout(resetDel.t);resetDel.t=setTimeout(resetDel,4000);return;
  }
  items=items.filter(function(i){return i!==it});
  resetDel();$('dlg').close();render();toast('已刪除 #'+it.id);
});
function checkUrl(){
  var h=$('idHint');h.className='hint';
  if(state.editing){h.textContent='編號 '+state.editing.id+'（編輯時不可更改）';return}
  var u=$('fUrl').value.trim();if(!u){h.textContent='貼上網址後會自動抓出編號。';return}
  var id=extractId(u);
  if(!id){h.textContent='網址裡找不到數字，將使用流水號作為編號。';return}
  var dup=byId(id);
  if(dup){h.className='hint warn';h.innerHTML='編號 '+esc(id)+' 已存在。<button type="button" id="goEdit">改為編輯這則</button>';
    $('goEdit').onclick=function(){$('dlg').close();openDlg(dup)};return}
  h.textContent='編號 '+id;
}
$('fUrl').addEventListener('input',checkUrl);
$('addBtn').addEventListener('click',function(){openDlg(null)});
$('cancel').addEventListener('click',function(){$('dlg').close()});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var it=state.editing,err=$('err');
  var url=$('fUrl').value.trim(),orig=$('fOrig').value.trim();
  if(!url||!orig){err.textContent='網址和原始標題必填。';err.hidden=false;return}
  if(!it){
    var id=extractId(url)||('N'+(seq++));
    if(byId(id)){err.textContent='這個編號已存在，請改為編輯。';err.hidden=false;return}
    it={id:id,url:url,orig:orig,last:null,count:0,created:Date.now(),titles:[],note:''};items.push(it);
  }
  it.cat=$('fCat').value;it.note=$('fNote').value.replace(/\s+$/,'');
  it.titles=state.draft.map(function(v){return V(v.t.replace(/\s+$/,''),v.last,v.count)}).filter(function(v){return v.t});
  state.pos[it.id]=Math.min(state.pos[it.id]||0,Math.max(it.titles.length-1,0));
  $('dlg').close();render();toast('已儲存 #'+it.id);
});
render();
</script>
